name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك ضغط ملف المشروع
        run: unzip -o wazen_mvp_v0.1.zip -d extracted

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: إنشاء سقالة Flutter كاملة ودمج الكود
        run: |
          flutter create --platforms=android wazen_project
          rm -rf wazen_project/lib
          cp -r extracted/wazen/lib wazen_project/lib
          cp extracted/wazen/pubspec.yaml wazen_project/pubspec.yaml

      - name: إصلاح استيراد ناقص في شاشة الإعدادات
        working-directory: wazen_project
        run: |
          sed -i "\|import '../../widgets/glass_card.dart';|a import '../../models/models.dart';" lib/screens/settings/settings_screen.dart

      - name: تثبيت الحزم
        working-directory: wazen_project
        run: flutter pub get

      - name: بناء APK
        working-directory: wazen_project
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: wazen-apk
          path: wazen_project/build/app/outputs/flutter-apk/app-release.apk
